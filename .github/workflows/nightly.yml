# What must not gate a merge, and must still be watched.
#
# Three things run here, for three different reasons. None of them is
# "we ran out of room in ci.yml".
#
#   network   A third party's web server is up when they decide it is.
#             A test that depends on it goes red for reasons unrelated
#             to the change, and a gate that does that teaches people to
#             ignore red. Deleting it is worse: noticing that the source
#             moved is its whole job.
#
#   loadtest  Its assertions are ranges tuned on a real machine - "5 to
#             20 of 50 connections got through" - and a shared runner is
#             noisier than that. Whether it can be a gate is a question
#             about this runner, and the honest way to answer it is to
#             collect nights rather than to guess. See PLAN.md, G1.
#
#   vulns     A CVE published against code nobody touched is exactly the
#             case a pull-request-only run cannot see.
#
#   fuzz      Fuzzing is not pass/fail, it is time spent. A gate can only
#             afford seconds, and seconds find what the seed corpus
#             already covers. Minutes per night, with the corpus carried
#             between runs, is where it starts finding things nobody
#             seeded. See PLAN.md, H1.
#
#   release   Building the package twice from two directories, and then
#             installing it into a real database to check the privilege
#             matrix it produces. Minutes, and a database. Here for the
#             same reason the load tests are: a gate that takes minutes
#             is a gate people route around. See PLAN.md, G2 and F2.
#
#   sast      gosec's first run on this repository produced 28 findings,
#             of which exactly one was real (PLAN.md, H2). Gating on that
#             ratio paints the pipeline red 27 times for every time it is
#             right, and a red that is usually wrong is a red people learn
#             to click past. It reports; a person triages.
name: nightly

on:
  schedule:
    # 03:17 UTC. Not on the hour: every scheduler on this platform is
    # busiest then, and a delayed run reports later than it needs to.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  vulnerabilities:
    name: govulncheck against unchanged code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # By full path. `go install` puts it in GOPATH/bin, and
          # whether that is on PATH is the runner image's business, not
          # ours - it was not on this project's development container,
          # where the command was simply "not found" and the step would
          # have looked like a tooling problem rather than a missing
          # check.
          "$(go env GOPATH)/bin/govulncheck" ./...

  network:
    name: the fetched datasets still exist and still parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Failing here means one of two things and both are worth knowing:
      # the source moved, or it changed shape. Either way every
      # deployment is quietly losing the known-bot signal, because this
      # project fetches that data rather than shipping it.
      - run: go test -tags network -count=1 -v ./internal/botdata/
      # The same question for the five IP range datasets M1 added. Four
      # of them are reachable only by a deployment that chose them, so a
      # URL that moved would show up as one warning line on a customer's
      # own server and nowhere else. ~124 MB streamed, under five
      # seconds; the parse is over a prefix, the digest over all of it -
      # internal/asnlookup/live_test.go says why the digest needs the
      # whole file.
      - run: go test -tags network -count=1 -v -timeout 20m ./internal/asnlookup/ -run TestLive

  load:
    name: limits and the live blocklist under real concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -count=3 because the question this job is answering is not "did
      # it pass" but "is it stable enough to be a gate". One green night
      # says nothing about a range assertion on a shared runner.
      #
      # Both packages, not just internal/loadtest. internal/asnlookup has
      # carried three loadtest-tagged tests - the cache hit ratio, the
      # "local_csv_path never touches the network" proof, and "a bare
      # resolver starts nothing in the background" - and this line named
      # one directory, so none of them had ever run anywhere. They pass;
      # that is not the point. A suite that never runs cannot report the
      # day it stops passing.
      #
      # internal/invariants asserts this the other way round now, so the
      # next tagged suite cannot arrive unrun.
      - run: go test -tags loadtest -race -count=3 -timeout 20m ./internal/loadtest/ ./internal/asnlookup/

  fuzz:
    name: fuzz the parsers that read attacker bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The corpus is the point of running this nightly rather than in
      # the gate. Go writes inputs that reached new coverage into
      # GOCACHE/fuzz and reuses them next time, so night N starts where
      # night N-1 stopped instead of rediscovering the same first
      # thousand paths. Keyed by run_id with a date prefix so each night
      # restores the most recent one and saves its own.
      - name: restore the fuzz corpus
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      # -fuzz takes one target per invocation, and the pattern is
      # anchored: an unanchored FuzzParseClientHello also matches
      # FuzzParseClientHelloFromRecords, and go test refuses to fuzz two
      # at once rather than picking one.
      - name: ja4 - the first bytes off the socket
        run: |
          go test -run XXX -fuzz 'FuzzParseClientHelloFromRecords$' -fuzztime 5m ./internal/ja4/
          go test -run XXX -fuzz 'FuzzParseClientHello$'            -fuzztime 5m ./internal/ja4/

      # A crash is written to testdata/fuzz/ as a regression case, which
      # is the artifact actually worth having - it turns a one-off
      # finding into a permanent unit test. Upload it, because the
      # workspace is thrown away and a crasher nobody kept is a night
      # wasted.
      - name: keep any crasher
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore

  sast:
    name: has gosec learned a rule we have not adopted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # @latest here, against the pinned version in the gate.
      #
      # The scan itself moved to ci.yml once it had a baseline to compare
      # against, so this job is no longer "the scan". What is left is the
      # question only a schedule can ask: gosec gains rules between
      # releases, and a new rule fires against code nobody touched -
      # structurally the same case as a CVE published against an
      # unchanged dependency, which is why govulncheck also runs here.
      #
      # Red means the newer gosec sees something the pinned one does not.
      # That is a human's decision (adopt the rule and triage what it
      # finds, or don't), not a broken build - which is exactly why it is
      # here and not in the gate.
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -fmt=json -quiet -no-fail -severity=medium -out=gosec.json ./...
          go run ./internal/sast/cmd/sastdiff -report gosec.json

  release:
    name: the package builds twice to the same bytes, and installs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      # fetch-depth: 0 for the tags, since the version comes from
      # `git describe`. A shallow clone would stamp every build "unknown"
      # and the reproducibility check would still pass - on two packages
      # that are both wrong.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # systemd-analyze is what validates the units. It is on the GitHub
      # runner image; the test skips without it, and a skip here would be
      # a check nobody notices stopped running - so it is installed
      # explicitly rather than hoped for.
      - name: systemd tooling
        run: |
          command -v systemd-analyze >/dev/null || sudo apt-get install -y systemd
          systemd-analyze --version
      # A database, because install.sh's whole point is the privilege
      # matrix it produces and the only thing that can confirm one is
      # PostgreSQL. The superuser here is `postgres`, deliberately not one
      # of the four service roles: a superuser holds every privilege, so
      # running the checks as one would pass every negative assertion for
      # the wrong reason.
      - name: psql, for the install script
        run: command -v psql >/dev/null || sudo apt-get install -y postgresql-client
      - run: go test -tags release -count=1 -timeout 30m -v ./release/
        env:
          CA_SUPERUSER_DSN: postgres://postgres:postgres@localhost:5432/postgres

  # Both end-to-end suites, nightly, because both take minutes and one of
  # them builds a container image.
  #
  # They ask the same question of two deployments, and the answer has
  # already differed. The container found five things the tarball install
  # did not: --db ignored whenever a DSN was given, config edits that
  # need GNU sed and silently did nothing under BusyBox, and two keys
  # written into TOML tables where no service reads them. None of those
  # was a container bug; the container was where an installation nobody
  # had quietly fixed by hand finally ran.
  endtoend:
    name: the whole product, from a tarball and from an image
    runs-on: ubuntu-latest

    services:
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: psql, for the install script
        run: command -v psql >/dev/null || sudo apt-get install -y postgresql-client

      # The tarball: build the release package, install it, run the
      # chain.
      - name: from a tarball
        run: go test -tags e2e -count=1 -timeout 20m -v ./e2e/
        env:
          CA_SUPERUSER_DSN: postgres://postgres:postgres@localhost:5432/postgres

      # The image: build it, bring up docker/compose.yml, run the same
      # chain. It brings its own database, so the service above is
      # untouched by it.
      - name: from the container image
        run: go test -tags docker -count=1 -timeout 30m -v ./e2e/
