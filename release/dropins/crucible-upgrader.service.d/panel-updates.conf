# Updates from the panel: the upgrader may replace the binaries.
#
# NOT installed by install.sh. It is put under
# /opt/crucible-analytic/dropins and waits there, because turning it on
# is the operator saying "let the panel replace the programs this
# machine runs" - which should be said on purpose. KURULUM.md 13.5,
# "İsteğe bağlı: panelden güncellemeyi açın", gives the four commands;
# this file is the third.
#
# # What it does
#
# crucible-upgrader.service mounts the whole filesystem read-only
# (ProtectSystem=strict) apart from the paths it lists. A drop-in's
# ReadWritePaths adds to that list rather than replacing it, so with
# this file in /etc/systemd/system/crucible-upgrader.service.d/ the
# upgrader can also write the binary directory. The sandbox is only half
# of it: the directory is root's until the operator gives it the
# upgrader's group, which is the first two of the four commands.
#
# # What it costs, said once more
#
# The upgrader installs only packages signed with our key, and it is the
# component that fetches them from the network. With this in place,
# whoever holds its account can replace the collector - the program in
# front of the customer's website. That is the button's own price; it is
# why this is a file somebody installs rather than a line in the unit.
# And it is why nothing root runs lives in that directory any more:
# restart.sh moved to /opt/crucible-analytic/libexec for this file.
#
# # Why no leading "-"
#
# The binary directory exists on every install - every service runs
# from it - so a missing one is a broken install, and a unit that
# refuses to start says so louder than one that starts and fails to
# write.
[Service]
ReadWritePaths=/opt/crucible-analytic/bin
