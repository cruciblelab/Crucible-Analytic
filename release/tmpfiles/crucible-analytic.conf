# The directory the doorbell goes in.
#
# # Why this file exists at all
#
# The upgrader asks for a restart by creating a file in
# /run/crucible-analytic. /run is tmpfs: it is empty after every boot,
# so the directory has to be recreated, and something has to own that.
# That something is systemd-tmpfiles, which is the mechanism for exactly
# this and runs before any of these units start.
#
# Without it the directory exists only until the next reboot, after
# which the upgrader finds it missing, reports "no restarter is
# configured", and installs updates without restarting anything. Not a
# crash - a feature that quietly stops working on a machine nobody
# rebooted while they were watching.
#
# # Why it is not installed automatically
#
# The upgrader decides whether a restarter is listening by whether this
# directory exists. That is the whole signal, and it is why install.sh
# puts this file under /opt and not under /etc/tmpfiles.d: a deployment
# that never opted in must not get the directory, or the upgrader would
# ring a doorbell nobody answers, wait for services that were never
# restarted, and roll back a release that was fine.
#
# Installing it is the operator saying "yes, restart them for me". See
# the note install.sh prints, and KURULUM.md.
#
# # The ownership
#
# root owns it and crucible-upgrader has the group, which is what lets
# both ends work through ordinary permission bits:
#
#   - the upgrader creates the file (group write),
#   - crucible-restart.service deletes it (owner write), which is why
#     that unit can drop CAP_DAC_OVERRIDE along with every other
#     capability.
#
# Reversed - upgrader-owned, root reaching in - root would need
# CAP_DAC_OVERRIDE to unlink, and the most privileged unit in this
# product would have to keep a capability to delete an empty file.
#
# Type    Path                    Mode  User  Group             Age
d /run/crucible-analytic 0775 root crucible-upgrader -
