altalan_geri_alinamaz = "Settle this now: it cannot be merged later. A visitor id is derived irreversibly from the site id and a daily salt, so in data collected under two ids the same person browsing both is permanently two visitors. Pageview counts can be added up afterwards; unique visitors cannot."

