reddedildi = "The analytics service did not recognise this panel. That is a configuration problem rather than a data one: the panel's API token needs renewing. Tell whoever set the server up."

[metin.pano.kart.ziyaretci]
baslik = "Visitors"
aciklama = "How many different people opened your site. No cookies: counted with a key that changes daily."

[metin.pano.kart.goruntuleme]
baslik = "Pageviews"
aciklama = "Total pages opened. One person opening several pages counts each of them."

[metin.pano.kart.oturum]
baslik = "Sessions"
aciklama = "One visit, start to finish. Sessions running across a period boundary are cut at it, so short periods show more of them."

[metin.pano.kart.hemen_cikma]
baslik = "Bounce rate"
aciklama = "The share of sessions that saw one page and left."

[metin.pano.kart.insan]
baslik = "Human traffic"
aciklama = "Distinct addresses that connected to your server and were not judged to be bots. This number needs no JavaScript — it is measured even where the snippet never runs."

[metin.pano.kart.bot]
baslik = "Bot traffic"
aciklama = "Connections judged to be automated. Search engines are in here too; not all of them are unwelcome."

[metin.pano.bos.kurulmamis]
beacon = "No measurements have ever arrived for this site. Counting pageviews needs the snippet embedded in your pages."
trafik = "No connection records exist for this site yet. The traffic collector may not be running in front of it."

[metin.pano.bos.bos]
beacon = "Nothing happened in this period."
trafik = "No connections recorded in this period."

[metin.pano.bos.ulasilamiyor]
beacon = "Could not be read."
trafik = "Could not be read."

[metin.pano.bos.reddedildi]
beacon = "Access refused."
trafik = "Access refused."

[metin.kurtarma]
baslik = "Your recovery codes"
ilk = "Your account is ready. Keep the codes below — if you forget your password or lose your phone, they get you back into the panel without waiting for anybody."
yeni = "Here are your new recovery codes. The old ones no longer work."
verildi = "New recovery codes for %s. Pass them on — these will not be shown again."
uyari_baslik = "These will not be shown again"
uyari = "Save them somewhere now: your password manager, your phone's notes, or a piece of paper. Once you close this page the codes themselves are gone; the panel only keeps what they hash to."
nasil = "Each code works once. When you cannot get in, use the \"I cannot get in\" link on the sign-in page. If you run out or lose them all, you can generate a new set from your account page."
kaydettim = "Saved them, continue"
kalan = "Recovery codes left"
kalan_az = "You are running low on recovery codes. Generate a new set before they run out."
kalan_yok = "You have no recovery codes left. Generate some now — the day you cannot get in is too late."
uret = "Generate new recovery codes"
uret_uyari = "Generating a new set invalidates the old one."

[metin.kurtarma.giris]
baslik = "I cannot get in"
govde = "Use one of your recovery codes to set a new password. Each code works once."
kod = "Recovery code"
kod_ipucu = "One of the codes you were given when your account was created. Dashes and spaces do not matter."
2fa = "I cannot reach my phone either"
2fa_ipucu = "Tick this and two-factor authentication is switched off, so you will have to set it up again. Leave it and it stays as it is."
gonder = "Reset my password"
geri = "Back to sign in"

[metin.kurtarma.hata]
gecersiz = "That email address and recovery code do not match."
