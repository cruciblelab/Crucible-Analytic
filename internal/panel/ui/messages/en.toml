# --- Outgoing email (C7.3) ---
#
# The job of this page is not sending. It is saying why sending did not
# work. The panel runs without email: invitations are links (C7.1), and
# password reset runs on recovery codes and an operator link (C7.2) -
# both built that way deliberately. This is a convenience, and a
# convenience must never break the thing it is a convenience for.
#
# The "posta.tani.*" and "posta.oneri.*" keys mirror the mail.Diagnosis
# values. A closed set with a two-way mirror test: a diagnosis with no
# sentence is a missing key, and a key with no diagnosis is a dead entry.

[metin.posta]
