# Bu sayfanın asıl işi göndermek değil, **gönderemediğinde neden
# gönderemediğini söylemek**. Panel e-postasız çalışıyor: davetler bir
# bağlantı (C7.1), parola sıfırlama kurtarma kodları ve operatör
# bağlantısı (C7.2) — ikisi de bilerek e-postasız kuruldu. Buradaki
# katkı bir kolaylık, ve bir kolaylık kolaylaştırdığı şeyi asla
# bozmamalı.
#
# "posta.tani.*" ve "posta.oneri.*" anahtarları mail.Diagnosis
