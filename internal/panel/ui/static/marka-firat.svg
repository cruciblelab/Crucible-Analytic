<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fırat Coşkun">
  <!-- A monogram rather than a photograph, and the reason is not
       squeamishness: an image embedded here ships inside every
       customer's binary and lives in a public repository's history for
       good, where "remove it later" is not a thing that exists.

       A photograph can replace this whenever its owner wants one. Drop
       the file in this directory and point the Mark field in
       internal/panel/web/about.go at it; the asset pipeline walks this
       directory, so nothing else needs changing. -->
  <rect width="64" height="64" rx="14" fill="#1f3a5f"/>
  <text x="32" y="33" fill="#ffffff"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="24" font-weight="600" letter-spacing="0.5"
        text-anchor="middle" dominant-baseline="central">FC</text>
</svg>
