# Crucible Analytic panelinin arayüz metinleri.
#
# Buradaki her satır bir kullanıcının okuyacağı metindir. Şablonlarda
# düz metin yazılmaz: `{{t "..."}}` çağrılır ve karşılığı burada durur.
# Şablonda geçen ama burada olmayan bir anahtar, panelin **açılmasını**
# engeller (bkz. messages.go) — boş bir alan olarak sayfada görünmez.
#
# Ters yön de denetleniyor: hiçbir şablonun ve hiçbir Go dosyasının
# adını anmadığı bir anahtar testte hata verir. Sebebi, kullanılmayan
# metinlerin birikmesi: içinde ne olduğu bilinmeyen bir katalog,
# kimsenin güvenmediği bir katalogdur. Yeni metin, onu gösteren sayfayla
# **aynı** commit'te eklenir.
#
# Buraya ait olmayan iki metin türü var:
#
#  1. Bir kuralın kendi gerekçesi. Bir ayarın neden kilitli olduğunu
#     anlatan cümle, kuralı yazan dosyanın yanında durur
#     (internal/panel/settings*.go). Gerekçeyi kuraldan ayırmak,
#     ikisinin birbirinden habersiz değişmesinin en kısa yoludur.
#  2. Yerelin tarih algoritmasının parçaları — ay ve gün adları,
#     "az önce", "dün". Bunlar mesaj değil, biçimlendiricinin kendisidir
#     ve format.go'da durur; oradaki yorum nedenini anlatıyor.
#
# Biçim: iç içe tablolar noktalı anahtara çevrilir; [gezinme] altındaki
# `atla` anahtarı "gezinme.atla" olur. Değerler yalnız metin olabilir
# ve boş bırakılamaz.

