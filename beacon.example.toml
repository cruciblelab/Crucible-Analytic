# Config for the client-side beacon ingest (cmd/beacon). Copy to
# beacon.toml, or point -config at it directly.
#
# A separate process and config from both the collector's and the read-only
# API's, on purpose - see cmd/beacon/main.go's doc comment for why.
#
# Apply internal/beacon/schema.sql once before starting this; like the rest
# of the project, it never runs DDL itself.

# Defaults to 127.0.0.1:8081 (loopback only). The recommended deployment
# has the site's own web server forwarding /_ca/ here, so binding publicly
# should be a deliberate edit rather than something that happens by
# omission.
listen_addr = "127.0.0.1:8081"

# Where /ca.js and /event mount. Defaults to /_ca. Short and unbranded on
# purpose: filter lists block analytics by URL pattern, and a path
# containing "analytics" or "track" is the easiest thing for them to match.
# path_prefix = "/_ca"

# Required. Should name a role that can INSERT into beacon_events and
# nothing else:
#
#   CREATE ROLE beacon_writer LOGIN PASSWORD 'change-me';
#   GRANT CONNECT ON DATABASE analytics TO beacon_writer;
#   GRANT USAGE ON SCHEMA public TO beacon_writer;
#   GRANT INSERT ON beacon_events TO beacon_writer;
#   GRANT SELECT ON panel_settings TO beacon_writer;
#
# That last grant is what lets the panel change this process's behaviour
# without an SSH session. It is a deliberate, minimal widening: one
# table, read-only, holding no personal data and no credentials. It does
# not let the beacon read analytics, users, sessions or tokens. Omit it
# and everything still works - the process simply keeps running on this
# file, which is why a failed settings read is logged rather than fatal.
timescale_dsn = "postgres://beacon_writer:change-me@localhost:5432/analytics"

# Required. The site_ids this beacon accepts events for. The snippet is
# public and its data-site attribute is a claim anyone can copy, so this
# allowlist is the only thing stopping an arbitrary caller from writing
# rows under someone else's site. Must match the collector's site_id
# exactly, or the two data sources will never join.
sites = ["mysite"]

# The networks whose X-Forwarded-For / X-Real-IP headers are believed.
#
# NOT OPTIONAL behind a reverse proxy: every request arrives from 127.0.0.1
# there, so the real visitor address exists only in a forwarded header. But
# those are just request headers - anyone can set them. Listing a network
# here says "this proxy is mine and I trust what it reports". Set it too
# broadly and any client can choose its own IP, and with it its own
# country, its own ASN and its own visitor ID.
#
# Leave empty when the beacon is exposed directly: forwarded headers are
# then ignored entirely, which is the correct behavior.
# MOVED TO THE PANEL (A5.1). Still read as the fallback, and still what
# this process runs on when the database is unreachable - but once the
# panel has a value, editing this line does nothing.
#
# This is the setting the repair catalogue puts at the top of its list,
# and the reason is worth reading before you set it: behind a proxy, an
# empty or wrong list here does not merely lose the visitor's address, it
# makes every number derived from that address wrong at the same time -
# visitor counts, geography, and the join back to the collector's data.
# It is the most common real misconfiguration there is, and it used to
# cost an SSH session to fix.
#
# To copy what is here into the panel, once:
#
#     panel -config panel.toml -migrate-settings beacon \
#           -migrate-from /etc/crucible/beacon.toml
trusted_proxies = ["127.0.0.1/32"]

# Narrows CORS. Empty (the default) allows every origin, which is safe
# here: the endpoint is write-only, its success response is an empty 204,
# and it is called with credentials omitted - so there is no response
# content for another origin to read and no ambient authority to abuse.
# allowed_origins = ["https://example.com"]

# In-memory write buffer. Events are batched and written with COPY rather
# than inserted inline, so a database hiccup cannot become latency on a
# visitor's page. The trade: events still buffered when the process is
# *killed* are lost. A clean shutdown drains them.
[buffer]
# How many rows may wait at once. Past this, Enqueue drops rather than
# blocking - backpressure must never reach a visitor's browser.
size = 10000
# Rows that force an immediate write before the interval is up.
batch_size = 500
# The longest a row waits before being written.
flush_interval_seconds = 2

# Bounds this process's own resource use, exactly as the collector's
# [limits] does. Zero or absent means no limit for that dimension.
#
# Also moved to the panel in A5.1, on the same terms as trusted_proxies
# above: the file is the fallback, the panel is where a change is made.
# The beacon's limits are their own settings, separate from the
# collector's - the collector sees every connection to the site and this
# sees only the visitors whose browser ran the snippet, so one number
# could not honestly mean both.
[limits]
# max_concurrent_requests = 0
# max_requests_per_second = 0
# fail_open (default), fail_closed, or throttle. Note that fail_open means
# something slightly different here than in the collector: there is no
# backend behind the beacon to keep serving, so it accepts the request and
# drops the event.
# overload_policy = "fail_open"
# throttle_queue_size = 0

# Country/ASN enrichment of beacon events. OFF by default, and that is the
# recommendation whenever a collector runs on the same host: it already
# resolves and stores country/ASN for every IP it sees, and every beacon
# event comes from a browser that necessarily connected through it - so the
# geography can be recovered at read time by joining on ip, at no memory
# cost. Turning this on loads a second full copy of the range tables
# (~135 MB) into this process. Worth it only when the beacon runs somewhere
# the collector does not.
[asn_lookup]
enabled = false
# cache_max_entries = 100000
# cache_ttl_seconds = 3600
# refresh_interval_seconds = 86400
# local_csv_path = "/var/lib/crucible/ip-data"

# Which query-string parameters reach the database.
#
# Configuration rather than a constant because the answer is a legal
# question as much as a technical one, and legal answers differ per
# deployment and change after the fact.
[campaign]
# Standard parameters this deployment refuses. Must name one of:
#   utm_source utm_medium utm_campaign utm_term utm_content
#   ref gclid fbclid msclkid
#
# utm_term is the usual candidate. It normally holds the keyword an
# advertiser bid on, but an ad platform can be configured to substitute
# the visitor's actual search text instead - so whether it may be stored
# depends on how the customer advertises and what their counsel says.
# drop_params = ["utm_term"]

# Additional, non-standard parameters to keep. They appear in the stored
# `query` string but get no column of their own, so they are visible
# rather than groupable.
#
# Every entry here is a decision to store something this project has no
# control over the contents of. Add a name only after checking what the
# site actually puts in it.
#
# Matched CASE-SENSITIVELY against what the browser sent, because query
# string keys are case-sensitive. A site emitting "?Partner=" needs
# "Partner" here; "partner" would match nothing. (drop_params above is
# the opposite - standard names are canonically lower case, so its case
# is ignored.)
# extra_params = ["partner"]

# Keep the raw gclid/fbclid/msclkid value, not just which ad network it
# came from.
#
# False by default, deliberately. The identifier is unique per click by
# construction and resolvable to a person by the network that issued it
# (never by us), and its only legitimate use - uploading offline
# conversions back to that network - is something this project does not
# do. With this off, `click_source` still records that a Google/Meta/
# Microsoft ad click happened, which is the part worth analysing.
# store_click_ids = false

# Where logs go, and how much of them is kept.
#
# The shape on disk is one directory per service, one per day, one file
# per category:
#
#   <dir>/beacon/2026-08-16/app.log
#                          /security.log
#                          /rejected.log
#                          /error.log
#
# A single flat file answers "what happened" and answers "what happened
# to authentication last Tuesday" only by grepping past everything else,
# which is the moment somebody needs an answer quickly. Retention is then
# deleting a directory rather than rewriting a file.
#
# Records are JSON lines: readable by a human, parseable by the panel.
[logging]
# Empty (or omitted) writes to stderr only, which is what running the
# binary by hand wants. Set it to enable the tree.
# dir = "/var/log/crucible"
# level = "info"          # debug, info, warn, error
# retention_days = 14     # day-directories kept; negative disables pruning
# max_file_mb = 64        # rotates a category file once it exceeds this
# also_stderr = false     # keep writing to stderr too, for journald
#
# level = "debug" is what makes the single most common misconfiguration
# visible: with it on, security.log records every forwarding header the
# server declined to believe, which is the answer to "why do all my
# visitors have the same IP". It is verbose by design - in a correct
# deployment it never fires, in a broken one it fires on every request.
#
# The log lifecycle has three stages, not one, because not all logs are
# equally worth keeping. access and ingest are enormous and interesting
# for about a week; security, auth and audit are small and are exactly
# what somebody asks for a year later. A single retention figure would
# either throw the second group away or keep the first group forever.
#
#   plain text  ->  compressed in place  ->  deleted
#               (archive_after_days)     (retention_days, or
#                                         important_retention_days for
#                                         security/auth/audit)
#
# A compressed day is still readable and roughly a tenth of the size, so
# keeping a year of security logs costs about what five weeks of them
# cost uncompressed.
# important_retention_days = 365
# archive_after_days = 7
#
# These are also panel settings (logs.* in developer mode), which is
# where they are meant to be changed once a deployment is handed over.

# How often live settings are re-read from panel_settings.
#
# Every value below and in [campaign] can be overridden from the panel;
# this file is the fallback for each one, so an empty or unreachable
# settings table changes nothing. When a read fails the last known values
# are kept - never the defaults, because resetting a customer's tuning
# during a database blip would be worse than a stale value and far
# harder to notice.
#
# Live today: campaign.drop_params, campaign.extra_params,
# campaign.store_click_ids, beacon.sites, privacy.ip_storage, logs.level
# and logs.verbose_until. Everything else still needs a restart, and the
# panel says so rather than pretending otherwise.
[settings]
# interval_seconds = 60

# ---------------------------------------------------------------------
# What personal data reaches the disk. Mirrors the collector's section of
# the same name, and has to: the two write the columns the crossover join
# compares, so masking one and not the other would leave that join
# finding nothing - with no error to say why.
[privacy]

# Moved here from [retention], where it silently did nothing.
#
# privacy.ip_hash_key is the field the collector and the beacon
# read, and this placeholder sat under [retention] - so
# release/install.sh, which writes the key by uncommenting this
# line, put it in the wrong table on every fresh install. In masked
# mode nothing needed it and nothing noticed; in hashed mode the
# service refuses to start while holding a config file that visibly
# contains an ip_hash_key. The installer reported "wrote the key"
# and "matches in both files" throughout, because it looks for the
# key with a regex that does not know what a table is.
#
# What actually happens: TimescaleDB gets a retention policy that drops
# whole chunks older than the *longest* retention any site asks for -
# cheap, and it can never remove data a site still wants. A site that
# asked to keep less than that gets the difference removed by a targeted
# delete, which is the one thing chunk-dropping cannot express. In the
# ordinary case where every site uses the same figure, no row-level
# delete ever runs.
#
# ip_hash_key must match the collector's exactly - see
# config.example.toml for what hashed mode does and does not protect
# against. At least 32 bytes; hashed mode refuses to start without one,
# because hashing with a weak key produces a value that looks like a
# pseudonym and reverses in microseconds.
# ip_hash_key = ""

# "masked" (the default) or "full". An absent or empty value means
# masked. See config.example.toml for what the mode costs and why the
# masking happens where it does.
#
# Live: changing privacy.ip_storage from the panel takes effect on the
# next event, without a restart. It is not retroactive - rows already
# written keep whatever was in force when they were written.
#
# Changing it needs the developer password, every time.
# ip_storage = "masked"

# ---------------------------------------------------------------------
# How long analytics data is kept.
#
# Until this existed nothing deleted a visit record, and both hypertables
# grew forever - on a machine that also serves the site, where the first
# symptom of a full disk is the collector failing to write.
[retention]
# The fallback when the panel has no figure stored. 90 days matches the
# panel's default and the read API's maximum range.
# days = 90
#
# How often the policy is re-applied. Hourly by default, deliberately
# slower than the settings tick: applying is idempotent, but a site
# keeping less than the deployment gets a row-level delete each pass and
# running that every minute would scan for nothing sixty times an hour.
# interval_hours = 1
