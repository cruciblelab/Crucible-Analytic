# Crucible Analytic — panel yapılandırması
#
# Panel, sistemin müşterinin giriş yaptığı yüzüdür. Kendi süreci ve
# kendi veritabanı rolüyle çalışır; o rolün analitik tablolarına
# **hiç** erişimi yoktur. Panel trafik sayılarını, dışarıdan bir panel
# nasıl okuyacaksa öyle, salt okunur HTTP API'sinden okur.
#
#     panel -config panel.toml
#
# Tarayıcının indirdiği her şey — stil dosyası, htmx, şablonlar, tüm
# metinler — binary'nin içindedir. CDN yok, npm yok, derleme adımı yok.

# Panel bir yönetim yüzeyi. Varsayılan olarak yalnız yerelden erişilir;
# dışarı açmak, önüne TLS sonlandıran bir web sunucusu koyup burayı
# bilerek değiştirmek demektir.
listen_addr = "127.0.0.1:8090"

# Panelin kendi veritabanı rolü. Yalnız panel_* tablolarına erişmeli.
# Zorunlu: panel açılışta bağlanır ve bağlanamazsa başlamaz.
#
# VERİTABANI ADI ANALİTİKLE AYNI OLMALI. Rol farklı, veritabanı aynı.
# Sebebi kurulum sihirbazının rol yalıtımı kontrolü: panelin bağlantısı
# üzerinden has_table_privilege(...) sorguluyor, yani traffic_snapshots
# ve beacon_events'in o bağlantıdan görünüyor olması gerekiyor. Panel
# ayrı bir veritabanındaysa o sorgu hata verir, kontrol "bakamadım" der,
# ve "bakamadım" devir teslimi bloke eder — yani müşteriye devretme
# adımı kalıcı olarak çalışmaz. Ayrımı sağlayan şey veritabanı değil,
# GRANT'lar; KURULUM.md §4 tam listeyi veriyor.
panel_dsn = "postgres://panel_user:PAROLA@localhost:5432/analytics"

# Analitik sayılarının okunacağı salt okunur API.
#
# Jetonun kendisi buraya, SHA-256'sı analytics-api.toml'a yazılır.
# Panelin jetonu sites = ["*"] olmalı: panel bütün siteleri sunuyor.
# Sonucu açıkça: bir müşterinin sayılarını diğerinden ayıran tek şey
# panelin kendi yetki kontrolü.
#
# Boş bırakmak desteklenen bir durum — site sayfaları "sayılar şu an
# okunamıyor" der ve panel ayakta kalır.
analytics_api_url = "http://127.0.0.1:8082"
analytics_api_token = ""

# Oturum çerezi Secure işaretlensin mi. Varsayılan: evet. Yalnız
# geliştirme sırasında, düz HTTP üzerinden yerelden giriş yapabilmek
# için kapatılır.
# secure_cookies = true

# Tarayıcıya "bu alan adına bir yıl boyunca düz HTTP ile bağlanma" der.
# Varsayılan kapalı ve secure_cookies'e bilerek bağlanmadı: sertifika
# sonradan takılan bir kurulumda yanlış açılmış bir HSTS, geri
# dönülecek bir HTTPS olmadığı için sizi panelden kilitler.
hsts = false

# Bir girişin ne kadar süreceği. Bir iş günü kadar uzun, gece açık
# unutulan bir dizüstünün sabaha oturum taşımayacağı kadar kısa.
session_lifetime_hours = 12

# Paneldeki her tarih ve saatin gösterileceği saat dilimi. Süs değil:
# akşamki trafik zirvesini UTC ile gösteren bir panel, İstanbul'daki
# müşteriye bunun öğleden sonra olduğunu söyler. Tanınmayan bir isim
# hata verir, sessizce UTC'ye düşmez.
timezone = "Europe/Istanbul"

# Beacon'ın genel adresi. Yalnız bir iş için: sahip sihirbazının
# gösterdiği ölçüm kodunu üretmek. Panel bunu kendi keşfedemez —
# beacon ayrı bir süreç ve önünde ne varsa o. Boş bırakılırsa o adım
# kodu uydurmak yerine nereden alınacağını söyler.
# beacon_url = "https://example.com"

# Panelin şifreleme anahtarı: 32 bayt, 64 hex karakter ya da base64.
# Kurulum betiği (release/install.sh) yoksa üretir ve buraya yazar. Elle
# üretmek isterseniz:
#
#     openssl rand -hex 32
#
# **Tek bir işi var:** giden posta şifresini veritabanında şifreli
# tutmak. Bu veritabanındaki geri okunabilir tek sır o — panel parolaları
# argon2id, davetler ve jetonlar SHA-256, hiçbirinin aslına ihtiyaç yok.
# SMTP şifresi ise her gönderimde karşı sunucuya verilmek zorunda, yani
# geri okunabilir olmak zorunda.
#
# Neyi engellediği tam olarak şu: veritabanının yapılandırma dosyası
# olmadan ele geçmesi. Gecelik yedek, hazırlık ortamına geri yükleme,
# hizmet dışı bırakılmış bir kopya — hepsi düz metin bir sütunu çalışan
# bir posta şifresine çevirir. Neyi engellemediği de aynı derecede net:
# panel sürecine ya da bu dosyaya erişen birini durdurmaz.
#
# Boş bırakmak desteklenen bir durum: posta hesabı kaydedilemez, posta
# sayfası bunu söyler, panelin geri kalanı çalışır.
#
# Değiştirirseniz kayıtlı posta şifresi açılmaz olur. Kaybedilecek tek
# şey odur — posta sayfası durumu söyler, şifre yeniden yazılır. Bilerek
# böyle: anahtar tek bir sütunu koruyor, şemaya dokunmuyor.
# secret_key = ""

# Collector'ın bilinen-bot dosyası. Panel bunu **yazmaz**; kurulum
# sihirbazı yalnızca "hiç getirilmiş mi" sorusunu cevaplayabilsin diye
# burada tanımlanır. Boş bırakılırsa o kontrol "bakılmadı" der —
# "baktık ve yoktu" ile aynı şey değil.
# bot_data_path = "/var/lib/crucible/known_bots.json"

# NOT: buradan aşağısı tablolara ait. secret_key ve bot_data_path
# üst düzey ayarlar - yani [roles], [developer_gate] ve [logging]
# başlıklarının **üstünde** olmak zorundalar. Bir zamanlar
# [developer_gate]'in altındaydılar: install.sh secret_key'i üretip
# "yazdım" diyor, panel açılıyor, ve anahtarı hiç görmüyordu - çünkü
# TOML'da bir başlıktan sonraki her anahtar o tabloya ait. Panel tek
# satır log basıp devam ediyordu, posta hesabı kaydedilemiyordu, ve
# hiçbir şey hata vermiyordu.

# Servislerin bağlandığı veritabanı rolleri. Panel bunlarla bağlanmaz;
# kendi DSN'i var. Kurulum kontrollerinin **başka** bir rolün ne
# yapabildiğini sorabilmesi için buradalar — panelin analitik tablolarını
# okuyamaması, API'nin yazamaması. Tanımlanmazsa o kontroller "bakılmadı"
# der, ve bakılamayan zorunlu bir kontrol devir teslimi engeller. Bu
# bilinçli: izolasyonu hiç doğrulanmamış bir kurulumu devretmek, kimsenin
# fark etmediği durumdur.

[roles]
collector = "collector"
beacon = "beacon_writer"
api = "analytics_reader"
panel = "panel_user"

# Kurulumun tercih ettiği dil. Kısıt değil tercih: tarayıcısı bu
# derlemede bulunan başka bir dili isteyen bir okuyucu onu görür — aynı
# ekipte herkes aynı dili okumuyorsa istenen budur. Burası, tarayıcı
# sunabildiğimiz bir tercih belirtmediğinde verilecek cevaptır. Boş
# bırakırsanız kararı tamamen tarayıcı verir.
#
# Bu derlemedeki diller: tr, en. Yeni dil eklemek,
# internal/panel/ui/messages/ dizinine bir .toml dosyası koyup yeniden
# derlemektir — Go tarafında güncellenecek bir liste yok. Var olmayan
# bir kod yazarsanız panel açılmaz ve elindeki dilleri söyler; yoksa
# kurulum, config dosyası başka bir şey derken temel dilde çalışırdı.
language = "tr"

# Hukuki ağırlığı olan ayarların önündeki geliştirici şifresi.
# Hash'i şu komut üretir:
#
#     go run ./cmd/devpass
#
# Bölüm hiç yoksa o ayarlar panelden kimse tarafından değiştirilemez —
# güvenli yön budur. Düz metin parola kabul edilmez; panel açılmaz.

[developer_gate]
password_hash = ""



[logging]
dir = "/var/log/crucible"
level = "info"
