# Copy this file to config.toml (or point --config at it directly) and
# fill in the values marked required below. Any field left out entirely
# keeps its default - see internal/config/config.go's defaults().

# Required. Which site this collector instance is fronting. Stamped onto
# every row it writes, so one database can hold several sites' data (one
# server running several collectors, one per customer site). Also the path
# segment this site is exposed under by the read API, hence the restricted
# character set: 1-64 chars, letters/digits/underscore/dash only.
site_id = "example-site"

# "passthrough" (default) or "full". See the README for what each means.
mode = "passthrough"

[network]
listen_addr = ":8443"
# Required. host:port of the site to proxy to. In both modes this is a
# plain host:port; full mode always proxies to it over plaintext HTTP
# (TLS is assumed to terminate here, at the collector).
backend_addr = "127.0.0.1:8080"
dial_timeout_seconds = 10
# passthrough-mode only: how long to wait for a complete TLS ClientHello
# before giving up on fingerprinting (the connection is still proxied).
handshake_timeout_seconds = 5

[tls]
# Required only when mode = "full": the backend's real TLS certificate/key,
# used to terminate client connections.
cert_file = ""
key_file = ""

[cache]
window_size_seconds = 60
ttl_seconds = 300
cleanup_interval_seconds = 60

[storage]
# Required. Postgres connection string for TimescaleDB.
timescale_dsn = "postgres://collector:collector@localhost:5432/analytics"
flush_interval_seconds = 10

[limits]
# Bounds the collector's OWN total resource usage (concurrent
# connections/requests and requests/second, summed across all IPs) so it
# can't become a resource-exhaustion target itself. These have real
# defaults even if you omit this whole section - see below.
max_concurrent_connections = 1000
max_requests_per_second = 500
# What happens once a limit above is exceeded:
#   "fail_open"   (default) - keep forwarding traffic to the backend, just
#                  skip fingerprinting/recording for the excess. The
#                  collector never takes your site down by default.
#   "fail_closed" - reject the excess connection/request outright.
#   "throttle"    - queue the excess (bounded by throttle_queue_size)
#                  until capacity frees up; falls back to fail_closed
#                  behavior if the queue itself is full.
overload_policy = "fail_open"
# Only used when overload_policy = "throttle".
throttle_queue_size = 200

[asn_lookup]
# Disabled by default. When false (or this whole section is omitted), the
# datasets are never downloaded or read and asnlookup's TimescaleDB tables
# are never touched - see internal/asnlookup/schema.sql and the README
# before turning this on (those tables must be created manually first).
# When true, every traffic_snapshots row is also automatically enriched
# with country/asn/asn_org at flush time - no separate flag for that.
enabled = false
# Turns on the ASN scoring signal (known_bot_asns below): a matching ASN
# adds a flat bonus to the bot-likelihood score. False (the default)
# means internal/scoring never even sees an ASN - see the README.
apply_to_scoring = false
# Only validated when enabled = true.
cache_max_entries = 50000
cache_ttl_seconds = 21600   # 6 hours
refresh_interval_seconds = 604800 # 1 week
# If set, every refresh reads <local_csv_path>/user-country-ipv4.csv,
# -ipv6.csv, origin-asn-ipv4.csv and -ipv6.csv from local disk instead of
# downloading them from GitHub Releases - no network access at all in that
# mode. Leave empty (the default) to download normally.
local_csv_path = ""
# A match on either list below rejects the connection/request outright,
# regardless of limits.overload_policy - see the README. Both empty (the
# default) means no blocking, and no extra Resolve() call added to the
# request path either.
blocked_countries = []   # e.g. ["CN", "RU"] - ISO 3166-1 alpha-2, case-insensitive
blocked_asns = []        # e.g. [64512]
# Only consulted when apply_to_scoring = true, above. A separate list
# from blocked_asns: these ASNs aren't blocked, just add a flat bonus to
# the score (a blocked ASN never reaches scoring, so reusing blocked_asns
# here wouldn't do anything).
known_bot_asns = []      # e.g. [16509] (AWS) - example only, not a recommendation

# ---------------------------------------------------------------------
# What personal data reaches the disk.
#
# Its own section rather than a key under [storage], because these are
# not storage decisions - they are answers to legal questions, and
# somebody reading this file to find out what the deployment keeps should
# find them together.
[privacy]
# "masked" (the default) or "full".
#
# masked zeroes an IPv4 address's last octet (/24) and truncates IPv6 to
# /64. An absent or empty value means masked: the setting nobody sets is
# the one that ends up in production, so it has to be the one that stores
# less.
#
# The masking happens when the row is built, and as the last step - the
# whole address derives the visitor id and resolves country and ASN
# first. So masked mode costs neither geography nor visitor counts. What
# it does cost is resolution in the crossover join between
# traffic_snapshots and beacon_events: two visitors in one /24 become one
# row there. The panel says so rather than showing a smaller number
# without explanation.
#
# Changing this from the panel requires the developer password - see the
# [developer] section in the panel's config and cmd/devpass.
# ip_storage = "masked"

# ---------------------------------------------------------------------
# How long traffic_snapshots is kept.
#
# Read from this file rather than from the panel, because the collector
# has no live-settings reader yet. The beacon does, so beacon_events
# already follows the panel - the two tables are configured in different
# places for now, which is a gap rather than a design.
[retention]
# 90 days, matching the panel's default and the read API's maximum range.
# Out of range is treated as unset, not clamped: a config saying 20000
# should be visible as a mistake.
# days = 90
#
# How often the policy is re-applied. Hourly is plenty - installing it is
# idempotent and TimescaleDB runs the drop on its own schedule.
# interval_hours = 1
#
# ip_hash_key keys the pseudonym in hashed mode. At least 32 bytes, and
# it must be *identical* in the beacon's config - the two write the two
# halves of the crossover join, and different keys make that join find
# nothing with no error to say why.
#
# What hashed mode buys, precisely: an address cannot be recovered from
# the database alone. It does not put addresses beyond the reach of
# whoever also holds this key - a /24 has ~16.7M possible values and
# trying them all takes under a second. The key lives beside the database
# password, so the party who could reverse it is the party who could
# already read everything.
# ip_hash_key = ""

# --- Bilinen bot parmak izleri -------------------------------------------
#
# Bu proje bu veri kümesini **dağıtmaz.** Veri başkasına ait; MIT lisanslı
# bir deponun içinde şartları yazılmamış üçüncü taraf verisi taşımak, o
# belirsizliği depoyu klonlayan herkese devretmek olurdu. Onun yerine
# kurulum veriyi kendi makinesine, kaynağın kendi şartlarıyla indirir:
#
#     collector -config config.toml -update-bot-data
#
# Ne zaman çalıştıracağınız size kalmış — cron, elle, ya da başka bir
# yerden. Bu yazılımın işi değil.
#
# Hiç çalıştırmamak **desteklenen bir durum**: bilinen-bot sinyali olmaz,
# diğer bütün sinyaller çalışmaya devam eder, ve collector açılışta bunu
# söyler. Sessizce eksilen bir şey yok.
#
# Örnek cron satırı (haftada bir, pazartesi 04:00):
#     0 4 * * 1 /usr/local/bin/collector -config /etc/crucible/config.toml -update-bot-data
[bot_data]
path = "/var/lib/crucible/known_bots.json"
# Kaynak adresi. Boş bırakılırsa varsayılan kullanılır. Yapılandırılabilir
# olmasının sebebi: üçüncü tarafın adresini binary'ye çakmak, o adres
# değiştiği gün kurulumun kendini güncelleyememesi demektir.
# source_url = "https://thebotaquarium.com/api/fingerprint/archive"
